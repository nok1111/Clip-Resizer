# Dependency policy: only permissive licences may ship in this proprietary app.
# AGPL/GPL/LGPL are rejected by omission.

[graph]
all-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "0BSD",
  "ISC",
  "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
