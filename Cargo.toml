[workspace]
resolver = "2"
members = ["src-tauri", "crates/cr-model", "crates/cr-files", "crates/cr-ffmpeg", "crates/cr-store"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ts-rs = "10"
tempfile = "3"
walkdir = "2.5"
sha2 = "0.10"

cr-model = { path = "crates/cr-model" }
cr-files = { path = "crates/cr-files" }
cr-ffmpeg = { path = "crates/cr-ffmpeg" }
cr-store = { path = "crates/cr-store" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
